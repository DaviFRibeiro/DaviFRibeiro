<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <title id="title">Davi Ribeiro: Data Engineer, BI and Analytics, Software, AI</title>
  <desc id="desc">Banner with the name Davi Ribeiro and a flow where ERP and CRM, support, fleet and HR, and paid media converge into BigQuery and reach a Power BI dashboard.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#11141B"/>
      <stop offset="1" stop-color="#1A1E27"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#F2C811"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" rx="18" fill="url(#background)"/>
  <rect x="1" y="1" width="1278" height="358" rx="17" fill="none" stroke="#2A2F3A" stroke-width="1.5"/>
  <rect x="64" y="72" width="44" height="4" rx="2" fill="#F2C811"/>

  <!-- identity -->
  <text x="64" y="108" fill="#8B93A3" font-size="14" font-weight="600" letter-spacing="3.5">DATA · ANALYTICS · SOFTWARE · APPLIED AI</text>
  <text x="62" y="174" fill="#F5F6F8" font-size="60" font-weight="700" letter-spacing="-1">Davi Ribeiro</text>
  <text x="64" y="214" font-size="20" font-weight="600">
    <tspan fill="#2DD4BF">Data Engineer</tspan><tspan fill="#5B6472"> · </tspan><tspan fill="#C4C9D2">BI &amp; Analytics</tspan><tspan fill="#5B6472"> · </tspan><tspan fill="#C4C9D2">Software</tspan><tspan fill="#5B6472"> · </tspan><tspan fill="#C4C9D2">AI</tspan>
  </text>
  <text x="64" y="256" fill="#A8AFBC" font-size="16.5">From raw source to business decision: pipelines, semantic models,</text>
  <text x="64" y="282" fill="#A8AFBC" font-size="16.5">data auditing, software and AI agents.</text>

  <!-- links: sources to BigQuery -->
  <g fill="none" stroke="#4A5261" stroke-width="1.75">
    <path d="M882 91 C 930 91, 930 180, 972 180"/>
    <path d="M882 147 C 925 147, 930 180, 972 180"/>
    <path d="M882 203 C 925 203, 930 180, 972 180"/>
    <path d="M882 259 C 930 259, 930 180, 972 180"/>
  </g>
  <path d="M1032 180 H 1082" fill="none" stroke="url(#flow)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- sources -->
  <g font-size="13" font-weight="600" fill="#D5D9E0" text-anchor="middle">
    <rect x="772" y="74" width="110" height="34" rx="8" fill="#1F242E" stroke="#3A414E"/>
    <text x="827" y="96">ERP &amp; CRM</text>
    <rect x="772" y="130" width="110" height="34" rx="8" fill="#1F242E" stroke="#3A414E"/>
    <text x="827" y="152">Support</text>
    <rect x="772" y="186" width="110" height="34" rx="8" fill="#1F242E" stroke="#3A414E"/>
    <text x="827" y="208">Fleet &amp; HR</text>
    <rect x="772" y="242" width="110" height="34" rx="8" fill="#1F242E" stroke="#3A414E"/>
    <text x="827" y="264">Paid media</text>
  </g>

  <!-- BigQuery -->
  <g fill="#14262A" stroke="#2DD4BF" stroke-width="2">
    <path d="M972 150 V 210 A 30 11 0 0 0 1032 210 V 150"/>
    <ellipse cx="1002" cy="150" rx="30" ry="11"/>
    <path d="M972 180 A 30 11 0 0 0 1032 180" fill="none" opacity="0.55"/>
  </g>
  <text x="1002" y="248" fill="#D5D9E0" font-size="13" font-weight="600" text-anchor="middle">BigQuery</text>

  <!-- BI dashboard -->
  <rect x="1082" y="124" width="134" height="112" rx="10" fill="#242015" stroke="#F2C811" stroke-width="2"/>
  <g fill="#F2C811">
    <rect x="1102" y="194" width="16" height="24" rx="2" opacity="0.55"/>
    <rect x="1126" y="176" width="16" height="42" rx="2" opacity="0.7"/>
    <rect x="1150" y="156" width="16" height="62" rx="2" opacity="0.85"/>
    <rect x="1174" y="140" width="16" height="78" rx="2"/>
  </g>
  <text x="1149" y="262" fill="#D5D9E0" font-size="13" font-weight="600" text-anchor="middle">Power BI</text>
</svg>
